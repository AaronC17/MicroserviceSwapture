<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Speed Test – WPM & Accuracy | SwapTure</title>
  <meta name="description" content="Free online typing speed test. Measure your WPM (words per minute) and accuracy. Available in English and Spanish. No sign-up required." />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { purple: { 950: '#2e1065', 900: '#4c1d95', 800: '#5b21b6', 700: '#6d28d9', 600: '#7c3aed' } } } }
    }
  </script>
  <style>
    #text-display {
      font-family: 'Courier New', monospace;
      font-size: 1.05rem;
      line-height: 2;
      letter-spacing: 0.02em;
      word-break: break-word;
    }
    #input-area {
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      resize: none;
    }
    .char-cursor { border-left: 2px solid #6d28d9; animation: blink 1s step-end infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>
<body class="bg-zinc-50 min-h-screen font-sans text-zinc-900">

  <header class="bg-white border-b border-zinc-200 sticky top-0 z-50">
    <nav class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <a href="/" class="font-extrabold text-xl tracking-tight text-zinc-900">Swap<span class="text-purple-900">Ture</span></a>
      <div class="flex items-center gap-3">
        <button id="lang-toggle" class="text-xs font-semibold border border-zinc-300 rounded-lg px-3 py-1.5 hover:border-purple-700 hover:text-purple-700 transition-colors">ES</button>
        <a href="/" class="text-sm text-zinc-400 hover:text-zinc-700 transition-colors">← All tools</a>
      </div>
    </nav>
  </header>

  <section class="bg-zinc-900 text-white">
    <div class="max-w-4xl mx-auto px-4 py-10 text-center">
      <h1 id="page-title" class="text-3xl sm:text-4xl font-extrabold mb-2 tracking-tight">Typing Speed Test</h1>
      <p id="page-subtitle" class="text-zinc-400 text-sm">Test your typing speed and accuracy</p>
    </div>
  </section>

  <main class="max-w-4xl mx-auto px-4 py-7 space-y-5">

    <!-- Stats row -->
    <div class="grid grid-cols-4 gap-3">
      <div class="bg-white border border-zinc-200 rounded-2xl p-4 text-center shadow-sm">
        <span id="wpm-val" class="block text-3xl font-extrabold text-zinc-900">0</span>
        <span id="wpm-label" class="text-xs text-zinc-400 font-semibold uppercase tracking-widest">WPM</span>
      </div>
      <div class="bg-white border border-zinc-200 rounded-2xl p-4 text-center shadow-sm">
        <span id="accuracy-val" class="block text-3xl font-extrabold text-zinc-900">100%</span>
        <span id="accuracy-label" class="text-xs text-zinc-400 font-semibold uppercase tracking-widest">Accuracy</span>
      </div>
      <div class="bg-white border border-zinc-200 rounded-2xl p-4 text-center shadow-sm">
        <span id="time-val" class="block text-3xl font-extrabold text-zinc-900">0s</span>
        <span id="time-label" class="text-xs text-zinc-400 font-semibold uppercase tracking-widest">Time</span>
      </div>
      <div class="bg-white border border-zinc-200 rounded-2xl p-4 text-center shadow-sm">
        <span id="chars-val" class="block text-3xl font-extrabold text-zinc-900">0/0</span>
        <span id="chars-label" class="text-xs text-zinc-400 font-semibold uppercase tracking-widest">Chars</span>
      </div>
    </div>

    <!-- Text display + input -->
    <div class="bg-white border border-zinc-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="px-6 py-5 border-b border-zinc-100">
        <p id="start-hint" class="text-xs text-zinc-400 mb-3 font-medium"></p>
        <div id="text-display" class="select-none min-h-[5rem]"></div>
      </div>
      <div class="px-6 py-5">
        <textarea
          id="input-area"
          rows="4"
          class="w-full border border-zinc-200 rounded-xl px-4 py-3 text-zinc-900 focus:outline-none focus:ring-2 focus:ring-purple-700 focus:border-purple-700"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        ></textarea>
      </div>
    </div>

    <!-- New test button -->
    <div class="flex justify-end">
      <button id="restart-btn" class="bg-purple-800 text-white rounded-xl px-5 py-2.5 font-semibold hover:bg-purple-900 transition-colors text-sm">
        New Test
      </button>
    </div>

    <!-- Results modal -->
    <div id="results-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8 text-center space-y-5">
        <h2 id="results-title" class="text-2xl font-extrabold text-zinc-900">Test Complete!</h2>
        <div class="grid grid-cols-3 gap-3">
          <div class="bg-purple-50 rounded-xl p-4">
            <span id="result-wpm" class="block text-3xl font-black text-purple-800">0</span>
            <span id="result-wpm-label" class="text-xs text-zinc-500 font-semibold uppercase tracking-widest">WPM</span>
          </div>
          <div class="bg-zinc-50 rounded-xl p-4">
            <span id="result-accuracy" class="block text-3xl font-black text-zinc-800">0%</span>
            <span id="result-accuracy-label" class="text-xs text-zinc-500 font-semibold uppercase tracking-widest">Accuracy</span>
          </div>
          <div class="bg-zinc-50 rounded-xl p-4">
            <span id="result-time" class="block text-3xl font-black text-zinc-800">0s</span>
            <span id="result-time-label" class="text-xs text-zinc-500 font-semibold uppercase tracking-widest">Time</span>
          </div>
        </div>
        <p id="result-msg" class="text-sm text-zinc-500 italic"></p>
        <button id="try-again-btn" class="w-full bg-purple-800 text-white rounded-xl px-4 py-3 font-semibold hover:bg-purple-900 transition-colors">
          Try Again
        </button>
      </div>
    </div>

  </main>

  <footer class="bg-white border-t border-zinc-200 mt-4">
    <div class="max-w-4xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-sm text-zinc-400">
      <span class="font-semibold text-zinc-700">Swap<span class="text-purple-900">Ture</span></span>
      <a href="/" class="hover:text-zinc-600 transition-colors">← All tools</a>
    </div>
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
